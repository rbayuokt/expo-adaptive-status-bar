<circle cx="230" cy="631" r="4" fill="#8C8C98"/>
<circle cx="364" cy="631" r="10" fill="#000"/>
<path d="M492 637 L504 625 L504 637 Z" fill="#8C8C98"/>
<rect x="518" y="624" width="11" height="15" rx="2.5" fill="none" stroke="#8C8C98" stroke-width="1.6"/><rect x="520.5" y="629" width="6" height="7.5" rx="1" fill="#8C8C98"/>
<text x="76" y="636" fill="#F4F4F6" font-size="13.5" font-weight="700" text-anchor="start">Android</text>
<text x="223.6" y="686" fill="#7C8CFF" font-size="12.5" font-weight="400" text-anchor="middle">left zone, 35%</text>
<text x="364" y="686" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="middle">ignored</text>
<text x="364" y="703" fill="#5E5E6A" font-size="11.5" font-weight="400" text-anchor="middle">camera here</text>
<text x="504.4" y="686" fill="#FFB547" font-size="12.5" font-weight="400" text-anchor="middle">right zone, 35%</text>
<text x="76" y="730" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">Each zone averages linear light. The darker and the brighter zone are</text>
<text x="76" y="751" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">combined where white and black icons get the same WCAG contrast,</text>
<text x="76" y="772" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">so a split background picks what is safest for the worse side.</text>
<text x="76" y="804" fill="#F4F4F6" font-size="13.5" font-weight="400" text-anchor="start">Dark-left or dark-right, both read the same: near 0.5</text>
<rect x="628" y="426" width="440" height="400" rx="20" fill="#15151C" stroke="rgba(255,255,255,0.08)"/>
<text x="656" y="470" fill="#5E5E6A" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">DECIDE</text>
<text x="656" y="500" fill="#F4F4F6" font-size="19" font-weight="700" text-anchor="start">Hysteresis keeps it calm</text>
<rect x="656" y="556" width="384" height="16" rx="8" fill="url(#lum)"/>
<rect x="817.28" y="550" width="61.440000000000055" height="28" rx="5" fill="#FFB547" fill-opacity="0.12" stroke="#FFB547" stroke-width="1.5"/>
