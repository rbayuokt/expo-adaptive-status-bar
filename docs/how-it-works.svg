<text x="878.72" y="604" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="middle" font-family="'SF Mono', Menlo, monospace">0.58</text>
<text x="656" y="540" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="start">white icons</text>
<text x="848" y="540" fill="#FFB547" font-size="12.5" font-weight="400" text-anchor="middle">keep current</text>
<text x="1040" y="540" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="end">dark icons</text>
<rect x="656" y="690.4" width="384" height="19.200000000000045" fill="#FFB547" fill-opacity="0.08"/>
