<text x="1040" y="804" fill="#9C9CA8" font-size="12" font-weight="400" text-anchor="end">icons</text>
<text x="656" y="804" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="start">scrolling a slow gradient, one reading per sample</text>
<rect x="1088" y="426" width="464" height="400" rx="20" fill="#15151C" stroke="rgba(255,255,255,0.08)"/>
<text x="1116" y="470" fill="#5E5E6A" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">THREADS</text>
<text x="1116" y="500" fill="#F4F4F6" font-size="19" font-weight="700" text-anchor="start">Who does what</text>
<rect x="1116" y="526" width="408" height="84" rx="14" fill="#1E1E27"/>
<rect x="1132" y="544" width="4" height="48" rx="2" fill="#5E5E6A"/>
<text x="1152" y="556" fill="#F4F4F6" font-size="15" font-weight="700" text-anchor="start">JavaScript</text>
<text x="1152" y="577" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="start">enable(config) once, on both platforms</text>
<text x="1152" y="595" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="start">onStyleChange, only when the style changes</text>
<rect x="1116" y="620" width="408" height="84" rx="14" fill="#1E1E27"/>
<rect x="1132" y="638" width="4" height="48" rx="2" fill="#7C8CFF"/>
<text x="1152" y="650" fill="#F4F4F6" font-size="15" font-weight="700" text-anchor="start">Main thread</text>
<text x="1152" y="671" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="start">Android: schedule, request the copy, apply</text>
<text x="1152" y="689" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="start">iOS: schedule, capture (about 1 ms), apply</text>
<rect x="1116" y="714" width="408" height="84" rx="14" fill="#1E1E27"/>
<rect x="1132" y="732" width="4" height="48" rx="2" fill="#FFB547"/>
<text x="1152" y="744" fill="#F4F4F6" font-size="15" font-weight="700" text-anchor="start">Worker / GPU</text>
<text x="1152" y="765" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="start">Android: copy on the GPU, read and analyse</text>
<text x="1152" y="783" fill="#9C9CA8" font-size="12.5" font-weight="400" text-anchor="start">iOS: unused, UIKit layers are main thread only</text>
<rect x="48" y="850" width="1504" height="64" rx="16" fill="#15151C" stroke="rgba(255,255,255,0.08)"/>
<text x="76" y="889" fill="#F4F4F6" font-size="14" font-weight="700" text-anchor="start">JS → native</text>
<text x="186" y="889" fill="#9C9CA8" font-size="14" font-weight="400" text-anchor="start" font-family="'SF Mono', Menlo, monospace">enable(config) · configure · setOverride · setHint</text>
<text x="860" y="889" fill="#F4F4F6" font-size="14" font-weight="700" text-anchor="start">native → JS</text>
<text x="970" y="889" fill="#9C9CA8" font-size="14" font-weight="400" text-anchor="start" font-family="'SF Mono', Menlo, monospace">onStyleChange { style, source, lightness }</text>
</svg>
