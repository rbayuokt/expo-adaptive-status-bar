<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" font-family="-apple-system, 'SF Pro Display', Inter, Helvetica, Arial, sans-serif">
<rect width="1600" height="950" fill="#0B0B0F"/>
<text x="48" y="64" fill="#7C8CFF" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2.4">UNDER THE HOOD</text>
<text x="48" y="104" fill="#F4F4F6" font-size="34" font-weight="800" text-anchor="start" letter-spacing="-0.8">One sample, from a drawn frame to the icons</text>
<text x="48" y="136" fill="#9C9CA8" font-size="16" font-weight="400" text-anchor="start">All of it runs in Swift and Kotlin. JavaScript sends the config once and only hears back when the style changes.</text>
<rect x="48" y="180" width="234" height="210" rx="20" fill="#15151C" stroke="rgba(255,255,255,0.08)"/>
<circle cx="78" cy="212" r="13" fill="#1E1E27" stroke="rgba(255,255,255,0.08)"/>
<text x="78" y="217" fill="#FFB547" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="100" y="217" fill="#5E5E6A" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">SIGNAL</text>
<text x="68" y="258" fill="#F4F4F6" font-size="19" font-weight="700" text-anchor="start">Something drew</text>
<text x="68" y="290" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">Android: OnDrawListener,</text>
<text x="68" y="311" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">once per drawn frame.</text>
<text x="68" y="332" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">iOS: a run loop turn that</text>
<text x="68" y="353" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">did work, or a touch.</text>
<path d="M284 285 H292" stroke="#5E5E6A" stroke-width="2" fill="none"/>
<path d="M291 280 L300 285 L291 290" stroke="#5E5E6A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="302" y="180" width="234" height="210" rx="20" fill="#15151C" stroke="rgba(255,255,255,0.08)"/>
<circle cx="332" cy="212" r="13" fill="#1E1E27" stroke="rgba(255,255,255,0.08)"/>
<text x="332" y="217" fill="#FFB547" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="354" y="217" fill="#5E5E6A" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">SCHEDULE</text>
<text x="322" y="258" fill="#F4F4F6" font-size="19" font-weight="700" text-anchor="start">Sample now or wait</text>
<text x="322" y="290" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">100 ms while it changes,</text>
<text x="322" y="311" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">backing off to 300 then</text>
<text x="322" y="332" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">900 ms while it doesn't.</text>
<text x="322" y="353" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">One sample in flight.</text>
<path d="M538 285 H546" stroke="#5E5E6A" stroke-width="2" fill="none"/>
<path d="M545 280 L554 285 L545 290" stroke="#5E5E6A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="556" y="180" width="234" height="210" rx="20" fill="#15151C" stroke="rgba(255,255,255,0.08)"/>
<circle cx="586" cy="212" r="13" fill="#1E1E27" stroke="rgba(255,255,255,0.08)"/>
<text x="586" y="217" fill="#FFB547" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="608" y="217" fill="#5E5E6A" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">CAPTURE</text>
<text x="576" y="258" fill="#F4F4F6" font-size="19" font-weight="700" text-anchor="start">Copy the strip</text>
<text x="576" y="290" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">Android: PixelCopy into a</text>
<text x="576" y="311" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">96×8 bitmap, GPU scaled.</text>
<text x="576" y="332" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">iOS: draw only the layers</text>
<text x="576" y="353" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">that touch the strip.</text>
<path d="M792 285 H800" stroke="#5E5E6A" stroke-width="2" fill="none"/>
<path d="M799 280 L808 285 L799 290" stroke="#5E5E6A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="810" y="180" width="234" height="210" rx="20" fill="#15151C" stroke="rgba(255,255,255,0.08)"/>
<circle cx="840" cy="212" r="13" fill="#1E1E27" stroke="rgba(255,255,255,0.08)"/>
<text x="840" y="217" fill="#FFB547" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="862" y="217" fill="#5E5E6A" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">MEASURE</text>
<text x="830" y="258" fill="#F4F4F6" font-size="19" font-weight="700" text-anchor="start">Read the icon zones</text>
<text x="830" y="290" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">Linear sRGB luminance in</text>
<text x="830" y="311" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">the left and right zones,</text>
<text x="830" y="332" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">combined where white and</text>
<text x="830" y="353" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">black tie on contrast.</text>
<path d="M1046 285 H1054" stroke="#5E5E6A" stroke-width="2" fill="none"/>
<path d="M1053 280 L1062 285 L1053 290" stroke="#5E5E6A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1064" y="180" width="234" height="210" rx="20" fill="#15151C" stroke="rgba(255,255,255,0.08)"/>
<circle cx="1094" cy="212" r="13" fill="#1E1E27" stroke="rgba(255,255,255,0.08)"/>
<text x="1094" y="217" fill="#FFB547" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text x="1116" y="217" fill="#5E5E6A" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">DECIDE</text>
<text x="1084" y="258" fill="#F4F4F6" font-size="19" font-weight="700" text-anchor="start">Hysteresis</text>
<text x="1084" y="290" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">Dark icons from 0.58,</text>
<text x="1084" y="311" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">white icons below 0.42.</text>
<text x="1084" y="332" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">Near a threshold, two</text>
<text x="1084" y="353" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">readings must agree.</text>
<path d="M1300 285 H1308" stroke="#5E5E6A" stroke-width="2" fill="none"/>
<path d="M1307 280 L1316 285 L1307 290" stroke="#5E5E6A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1318" y="180" width="234" height="210" rx="20" fill="#15151C" stroke="rgba(255,255,255,0.08)"/>
<circle cx="1348" cy="212" r="13" fill="#1E1E27" stroke="rgba(255,255,255,0.08)"/>
<text x="1348" y="217" fill="#FFB547" font-size="13" font-weight="700" text-anchor="middle">6</text>
<text x="1370" y="217" fill="#5E5E6A" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">APPLY</text>
<text x="1338" y="258" fill="#F4F4F6" font-size="19" font-weight="700" text-anchor="start">Set the icons</text>
<text x="1338" y="290" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">override › hint › sample.</text>
<text x="1338" y="311" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">Android: insets controller.</text>
<text x="1338" y="332" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">iOS: setStatusBarStyle.</text>
<text x="1338" y="353" fill="#9C9CA8" font-size="13.5" font-weight="400" text-anchor="start">Only when it changed.</text>
<rect x="48" y="426" width="560" height="400" rx="20" fill="#15151C" stroke="rgba(255,255,255,0.08)"/>
<text x="76" y="470" fill="#5E5E6A" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">WHAT GETS MEASURED</text>
<text x="76" y="500" fill="#F4F4F6" font-size="19" font-weight="700" text-anchor="start">Only where the icons are</text>
<defs>
  <linearGradient id="skyIos" x1="0" x2="1"><stop offset="0" stop-color="#14121F"/><stop offset="0.55" stop-color="#4B3E7A"/><stop offset="1" stop-color="#F3E3C8"/></linearGradient>
  <linearGradient id="skyAndroid" x1="0" x2="1"><stop offset="0" stop-color="#EDE6DA"/><stop offset="0.5" stop-color="#5E7C78"/><stop offset="1" stop-color="#14201F"/></linearGradient>
  <linearGradient id="lum" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
